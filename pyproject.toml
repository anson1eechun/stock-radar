[project]
name = "stock-radar"
version = "0.1.0"
description = "台股事件驅動選股系統"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0",
    "yfinance>=0.2.50",
    "pydantic>=2.8",
    "streamlit>=1.40",
    "discord.py>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
stock-radar = "stock_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stock_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
